<style>
:root{--navy:#0A1633;--navy2:#1B2B5E;--blue:#1B4B9F;--yellow:#FFD24D;--bg:#F2F5FA;--text:#1f2937;--muted:#64748b;--line:#E1E8F3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:14px 16px}
header .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
header b{font-size:15px}
header span{font-size:11px;letter-spacing:.3em;opacity:.8}
h1{font-size:22px;line-height:1.45;margin:22px 0 6px;color:var(--navy)}
.lead{font-size:13.5px;color:var(--muted);margin:0 0 18px}
.card{background:#fff;border-radius:16px;padding:18px 16px;margin:12px 0;box-shadow:0 1px 3px rgba(10,22,51,.06)}
label{display:block;font-weight:700;font-size:14.5px;margin:0 0 6px}
textarea,input[type=text],input[type=url]{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:15px;background:#fafbfd;resize:none}
textarea:focus,input:focus{outline:none;border-color:var(--blue)}
.field{margin-bottom:16px}
.field:last-child{margin-bottom:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;font-weight:700;font-size:14px;background:#fafbfd;cursor:pointer}
.opt.on{border-color:var(--blue);background:#EEF3FF;color:var(--navy)}
.ohead{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;color:var(--navy)}
.badge{font-size:11px;font-weight:700;color:var(--blue);background:#EEF3FF;border-radius:999px;padding:1px 9px}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 14px}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font:inherit;font-weight:900;font-size:16px;cursor:pointer;text-align:center;text-decoration:none}
.btn.main{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}
.btn.cta{background:#F97316;color:#fff;margin-top:10px}
.btn.ghost{background:#E6EBF3;color:var(--navy2);font-weight:700;font-size:14px;margin-top:10px}
.demo{margin-top:14px;font-size:12.5px;color:var(--muted)}
.demo button{border:1px dashed #94a3b8;background:#fff;border-radius:999px;padding:5px 12px;margin:4px 4px 0 0;font:inherit;font-size:12.5px;cursor:pointer;color:var(--navy2)}
.err{color:#dc2626;font-size:13px;margin-top:8px;min-height:1em}
/* loading */
#loading{text-align:center;padding:60px 10px}
.spin{width:46px;height:46px;border:5px solid #dbe3f0;border-top-color:var(--blue);border-radius:50%;margin:0 auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.stepline{font-size:14px;color:var(--muted);margin:6px 0}
.stepline.done{color:var(--navy);font-weight:700}
.wait{font-size:12px;color:var(--muted);margin-top:14px}
/* result */
.for{font-size:13px;color:var(--muted);margin:22px 0 2px}
.src{font-size:12.5px;color:var(--navy2);background:#EEF3FF;border-radius:10px;padding:7px 10px;margin:6px 0 0}
.h2{font-size:12px;font-weight:900;letter-spacing:.2em;color:var(--blue);margin:0 0 6px}
.concept{font-size:23px;font-weight:900;color:var(--navy);line-height:1.4;margin:2px 0 10px}
.crow{display:flex;gap:10px;border-top:1px solid var(--line);padding:7px 0;font-size:13.5px}
.crow b{flex:none;width:6.6em;color:var(--blue);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#EEF3FF;color:var(--navy2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.market{background:#F6F8FC;border-radius:12px;padding:10px 12px;margin:2px 0 8px;font-size:13px}
.market .top{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);text-decoration:none;margin-bottom:4px}
.market img{width:26px;height:26px;border-radius:50%}
.comp{border-top:1px solid var(--line);padding:12px 0}
.comp:first-of-type{border-top:none}
.chead{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.chead .ic{width:46px;height:46px;border-radius:50%;flex:none;background:#e5e7eb;object-fit:cover}
.chead .nm{font-weight:900;font-size:14.5px;line-height:1.35}
.chead .sb{font-size:12px;color:var(--muted)}
.chead .go{margin-left:auto;flex:none;font-size:11.5px;font-weight:700;color:#fff;background:#E60012;border-radius:999px;padding:3px 10px}
.comp .d{font-size:13px;color:var(--muted);margin-top:6px}
.comp .g{font-size:13px;margin-top:2px}
.comp .g b{color:#F97316}
.vrow{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;-webkit-overflow-scrolling:touch}
.vcard{flex:none;width:152px;text-decoration:none;color:inherit}
.vcard img{width:152px;height:86px;object-fit:cover;border-radius:8px;display:block;background:#e5e7eb}
.vcard .vt{font-size:11.5px;line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vcard .vv{font-size:11px;color:var(--muted)}
.plan{display:flex;gap:10px;border-top:1px solid var(--line);padding:11px 0}
.plan:first-of-type{border-top:none;padding-top:2px}
.plan .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--yellow);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.plan .t{font-weight:900;font-size:14.5px;line-height:1.5}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:0 8px;margin:4px 4px 2px 0;font-weight:700}
.tag.k{background:#FFF4D6;color:#8a5a00}
.tag.y{background:#EEF3FF;color:var(--navy2)}
.plan .w{font-size:13px;color:var(--muted)}
.thumb{border-top:1px solid var(--line);padding:14px 0 6px}
.thumb:first-of-type{border-top:none;padding-top:4px}
.thumb svg{width:100%;height:auto;display:block;border-radius:10px}
.thumb .cap{font-weight:900;font-size:13.5px;margin-top:8px;line-height:1.5}
.thumb .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.thumb .aim{font-size:13px;margin-top:4px}
.thumb .aim b,.borrow b{color:#F97316}
.ref{display:flex;gap:10px;align-items:flex-start;background:#F6F8FC;border-radius:10px;padding:8px;margin-top:8px;text-decoration:none;color:inherit}
.ref img{width:118px;height:66px;object-fit:cover;border-radius:6px;flex:none;background:#e5e7eb}
.ref .rl{font-size:11px;font-weight:900;color:var(--blue)}
.ref .rt{font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ref .rm{font-size:11px;color:var(--muted)}
.borrow{font-size:12.5px;margin-top:4px}
ol.steps{margin:0;padding-left:20px;font-size:14px}
ol.steps li{margin:4px 0}
.note{font-size:11.5px;color:var(--muted);margin-top:12px}
.hide{display:none}
</style>

<body>
<header><div class="in"><b>あなた専用のYouTube設計</b><span>TSUZURU</span></div></header>
<div class="wrap">

<section id="form">
  <h1>あなたの会社専用の<br>YouTube設計を<br>その場でつくります</h1>
  <p class="lead">コンセプト・競合チャンネル・企画・サムネイル案まで。企業のYouTubeを支援してきたTsuzuruの知見をもとに作ります。</p>
  <div class="card">
    <div class="field"><label for="biz">どんな事業ですか？</label>
      <textarea id="biz" rows="2" placeholder="例：埼玉で注文住宅をつくる工務店"></textarea></div>
    <div class="field"><label for="aud">動画を届けたい相手は？</label>
      <textarea id="aud" rows="2" placeholder="例：はじめて家を建てる30〜40代の夫婦"></textarea></div>
    <div class="field"><label>YouTubeでいちばん叶えたいこと</label>
      <div class="opts" id="goal">
        <div class="opt" data-v="問い合わせ・集客">問い合わせ・集客</div>
        <div class="opt" data-v="採用">採用</div>
        <div class="opt" data-v="商談の成約率アップ">商談の成約率アップ</div>
        <div class="opt" data-v="会社を知ってもらう">会社を知ってもらう</div>
      </div></div>
  </div>
  <div class="card">
    <div class="ohead">もっと精度を上げる<span class="badge">任意</span></div>
    <p class="hint">入れていただくと、ホームページや実績の内容を読み込んで、あなたの会社にしか作れない提案にします。わかるものだけで大丈夫です。</p>
    <div class="field"><label for="company">会社名・屋号</label>
      <input type="text" id="company" placeholder="例：株式会社◯◯工務店"></div>
    <div class="field"><label for="hp">ホームページのURL</label>
      <input type="url" id="hp" inputmode="url" autocapitalize="off" placeholder="https://"></div>
    <div class="field"><label for="blog">ブログ・note・SNSのURL</label>
      <input type="url" id="blog" inputmode="url" autocapitalize="off" placeholder="https://"></div>
    <div class="field"><label for="yt">いまのYouTubeチャンネルのURL（ある方）</label>
      <input type="url" id="yt" inputmode="url" autocapitalize="off" placeholder="https://www.youtube.com/@..."></div>
    <div class="field"><label for="str">強み・実績・よく聞かれる質問など</label>
      <textarea id="str" rows="3" placeholder="例：創業30年・年間40棟。自然素材の家が得意。「総額いくら？」とよく聞かれる"></textarea></div>
  </div>
  <button class="btn main" id="go">設計をつくる（無料）</button>
  <div class="err" id="err"></div>
  <div class="demo" id="demo">入力例を入れてみる
    <button data-k="koumuten">工務店の例</button><button data-k="rpo">IT採用の会社の例</button></div>
</section>

<section id="loading" class="hide">
  <div class="spin"></div>
  <div id="steplines"></div>
  <div class="wait">1分ほどかかります。このままお待ちください。</div>
</section>

<section id="result" class="hide"></section>
</div>

<script>
// 本番：Google Apps Script のURLを入れると、その場でAIが作る。空のときは試作版（例の2つだけ表示）
const API_URL = "https://script.google.com/macros/s/AKfycbwtQtVQrfOaH9p1loaIjetJCYi-IfV3jGSfXBTrJVm7AbDf5KaeVqPbmxwWx3KZTkC4eg/exec";
const CONSULT_URL = "https://tsuzuru-movie.com/contact/?utm_source=line&utm_medium=sekkei";
const DEMO = {"koumuten": {"input": {"business": "埼玉で注文住宅をつくる工務店", "audience": "はじめて家を建てる30〜40代の夫婦", "goal": "問い合わせ・集客"}, "concept": {"title": "建てる前に見る、地元工務店のホンネ", "desc": "埼玉で家を建てる人のために、工務店の社長と設計士が「後悔しない家づくり」の本当のところを話すチャンネル。全国向けの大手チャンネルが話せない、埼玉の土地・相場・暮らしの話で差をつけます。"}, "names": ["埼玉の家づくり相談室", "建てる前に見るチャンネル", "工務店社長のホンネ家づくり"], "target": "埼玉ではじめて注文住宅を考えている30〜40代の夫婦。とくに「ハウスメーカーと工務店で迷っている」「総額がいくらになるか不安」な人", "competitors": [{"name": "職人社長の家づくり工務店", "subs": "25.6万人", "note": "工務店の社長が業界の裏側を話す、この分野の最大手", "gap": "全国向けなので、埼玉の土地や相場の話はできない"}, {"name": "木の家専門店 谷口工務店", "subs": "2.4万人", "note": "滋賀の工務店。社長と設計士が家づくりのポイントを解説。1年で登録者が約1.2倍", "gap": "地方の工務店でも伸びる証拠。同じ型を埼玉でやる"}, {"name": "行列のできる工務店（埼玉・川口）", "subs": "1.2万人", "note": "同じ埼玉の工務店。ショート動画が中心", "gap": "長尺のルームツアー＋費用公開で、じっくり検討する人を取りにいく"}], "keywords": ["注文住宅 後悔", "工務店 選び方", "ハウスメーカー 工務店 違い", "注文住宅 費用", "注文住宅 間取り 後悔", "平屋 間取り", "土地探し コツ", "注文住宅 ルームツアー 30坪"], "plans": [{"title": "ハウスメーカーと工務店、どっちで建てる？埼玉の工務店社長が本音で答えます", "keyword": "ハウスメーカー 工務店 違い", "why": "迷っている人がそのまま検索する言葉。工務店が自分で言うから信頼される", "thumb": ["ハウスメーカーと", "工務店", "選ぶ基準は？"]}, {"title": "【費用公開】埼玉で30坪の注文住宅、総額いくらかかった？（施主さんの許可をいただいて公開）", "keyword": "注文住宅 費用", "why": "いちばん知りたいのに、どこも出さない数字。見学会の申し込みにつながりやすい", "thumb": ["30坪の家", "総額いくら？", "全部見せます"]}, {"title": "注文住宅で後悔した間取り10選｜建てた人に聞いたリアル", "keyword": "注文住宅 間取り 後悔", "why": "「後悔」は検索が多い言葉。施主さんの声を使えば、ほかにない一次情報になる", "thumb": ["その間取り", "住んでから", "後悔します"]}, {"title": "【ルームツアー】30坪・4人家族の家｜建てた理由と、住んでみてどうか", "keyword": "注文住宅 ルームツアー 30坪", "why": "見て比べたい人が必ず見る型。施工事例がそのまま動画になる", "thumb": ["30坪で", "4人家族が", "ゆったり暮らす"]}, {"title": "工務店の選び方｜見積もりのこの項目で、いい会社か分かります", "keyword": "工務店 選び方", "why": "選ぶ側の悩みに正面から答えると、「この会社なら」と思ってもらえる", "thumb": ["見積もりの", "この項目で", "会社が分かる"]}], "thumbs": [0, 1, 2], "steps": ["まず「会社の顔」になる5本（社長の家づくりへの考え方・ルームツアー2本・家づくりの流れ・よくある質問）", "次に、検索される言葉（後悔・費用・間取り・選び方）で月4本", "見学会・相談会の申し込みを、概要欄の上3行と動画の中で毎回案内"]}, "rpo": {"input": {"business": "IT企業向けの採用代行（RPO）", "audience": "エンジニアが採れないIT企業の経営者・人事", "goal": "問い合わせ・集客"}, "concept": {"title": "IT採用の中の人", "desc": "エンジニア採用で本当に起きていることを、現場を知る代表が話すチャンネル。採用担当者向けは市場が小さいので、再生数より「探している人に見つけてもらう」「商談の前に信頼してもらう」ことを狙います。"}, "names": ["エンジニア採用の裏側", "IT採用の中の人", "エンジニア採用ラボ"], "target": "スタートアップ〜グロースのIT企業の経営者・CTO・人事責任者。とくに「エンジニアが採れない」「人事が1〜2人で手が回らない」会社", "competitors": [{"name": "ジンジゴト（即戦力RPO）", "subs": "1,130人", "note": "スタートアップ・エンジニア採用のRPO。いちばん近い競合", "gap": "最近はショート中心。長尺で深く話すチャンネルは空いている"}, {"name": "採用係長の採用道", "subs": "6,540人", "note": "中小企業の経営者・人事向け。1本あたり平均 約2,000回", "gap": "IT・エンジニアに絞った話はしていない"}, {"name": "IT菩薩モロー（参考：求職者向け）", "subs": "3.6万人", "note": "IT転職エージェント。転職エージェント比較の動画は136万回", "gap": "見る人はエンジニア側。採用する側はまだ手薄"}], "keywords": ["エンジニア採用", "採用代行とは", "rpoとは", "リファラル採用", "採用 失敗", "スカウトメール", "面接官 質問", "採用 ai"], "plans": [{"title": "エンジニア採用が失敗する会社の特徴3つ｜元エンジニアの採用コンサルが本音で話す", "keyword": "エンジニア採用", "why": "「失敗する会社」型は開かれやすい。現場を知る人の一次情報になる", "thumb": ["その求人票", "エンジニアに", "読まれてない"]}, {"title": "採用代行（RPO）とは？頼んでも採れない会社と、頼むべき会社", "keyword": "採用代行とは", "why": "検索されている言葉そのまま。「向いていない会社もある」と正直に話すと信頼になる", "thumb": ["採用代行", "頼んでも", "採れない会社"]}, {"title": "スカウトの返信率が上がる文面・下がる文面", "keyword": "スカウトメール", "why": "明日から使える実務ネタで保存される", "thumb": ["そのスカウト", "開かれずに", "消えてます"]}, {"title": "エンジニアが内定を辞退する本当の理由｜人事が知らない選考の裏側", "keyword": "採用 辞退", "why": "「年収じゃない」という常識の逆を言う型", "thumb": ["内定辞退", "本当の理由は", "年収じゃない"]}, {"title": "採用業務はAIでどこまで減らせる？実際のやり方を全部見せます", "keyword": "採用 ai", "why": "今いちばん関心が高いテーマ。自社の仕組みの見せ場になる", "thumb": ["採用業務", "AIで", "ここまで減る"]}], "thumbs": [0, 1, 2], "steps": ["まず「会社の顔」になる5本（代表のストーリー・サービス・支援の流れ・メンバー・よくある質問）", "紹介をもらったら、商談の前に動画のリンクを送る", "検索される言葉で月4本。事例・対談は、出てくださる支援先が決まり次第"]}};
const TITLE_TYPES = {T1: "緊急・警告型", T2: "講義型", T3: "失敗回避型", T4: "数字の裏づけ型", T5: "問い→断言型"};
const THUMB_TYPES = {A: "セリフ", B: "内部公開", C: "対立", D: "問いかけ", E: "結果の告白", F: "名指し"};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val = id => $(id).value.trim();
let goal = "", demoKey = "";

document.querySelectorAll("#goal .opt").forEach(o => o.onclick = () => {
  document.querySelectorAll("#goal .opt").forEach(x => x.classList.remove("on"));
  o.classList.add("on"); goal = o.dataset.v;
});
document.querySelectorAll("#demo button").forEach(b => b.onclick = () => {
  const d = DEMO[b.dataset.k]; if (!d) return;
  demoKey = b.dataset.k; $("#biz").value = d.input.business; $("#aud").value = d.input.audience;
  document.querySelectorAll("#goal .opt").forEach(x => x.classList.toggle("on", x.dataset.v === d.input.goal));
  goal = d.input.goal;
});
["#biz", "#aud"].forEach(id => $(id).addEventListener("input", () => { demoKey = ""; }));

$("#go").onclick = async () => {
  const req = {business: val("#biz"), audience: val("#aud"), goal,
               company: val("#company"), hp: val("#hp"), blog: val("#blog"), youtube: val("#yt"), strengths: val("#str")};
  if (!req.business || !req.audience || !goal) { $("#err").textContent = "上の3つ（事業・届けたい相手・叶えたいこと）は入力してください"; return; }
  $("#err").textContent = "";
  const steps = [];
  if (req.hp || req.blog || req.youtube) steps.push("ホームページ・チャンネルを読んでいます");
  steps.push("競合チャンネルと、よく見られている動画を調べています", "実際に検索されている言葉を調べています",
             "Tsuzuruの知見をもとに、コンセプトと企画を考えています", "競合のサムネイルを参考に、サムネイル案をつくっています");
  $("#steplines").innerHTML = steps.map(s => `<div class="stepline">${s}</div>`).join("");
  $("#form").classList.add("hide"); $("#loading").classList.remove("hide"); window.scrollTo(0, 0);
  const lines = document.querySelectorAll(".stepline");
  let i = 0; const timer = setInterval(() => { if (i < lines.length) lines[i++].classList.add("done"); }, API_URL ? 9000 : 700);
  try {
    let data;
    if (API_URL) {
      const r = await fetch(API_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(req)});
      data = await r.json();
      if (data.error) throw new Error(data.error);
    } else {
      await new Promise(r => setTimeout(r, 3000));
      data = DEMO[demoKey];
      if (!data) throw new Error("試作版では「例で試す」の2つだけ表示できます。本番では、入力した内容でその場でAIが作ります。");
    }
    clearInterval(timer); render(data, req.business);
  } catch (e) {
    clearInterval(timer);
    $("#loading").classList.add("hide"); $("#form").classList.remove("hide");
    $("#err").textContent = e.message || "うまく作れませんでした。時間をおいてもう一度お試しください。";
  }
};

// ---------- サムネイル案の描き方 ----------
// 知見DB：文字は12字以下・数字なし／顔が主役か文字が主役に振り切る（人物は中央・表情は真剣/驚き/不満）／背景は単色・色は3色まで
// 型（A セリフ／B 内部公開／C 対立／D 問いかけ／E 結果の告白／F 名指し）ごとに飾りを変える
const PAL = {
  navy:   {bg: "#0f1d44", bg2: "#23408a", dark: true},
  black:  {bg: "#0d0d0d", bg2: "#2e2e2e", dark: true},
  red:    {bg: "#c8101e", bg2: "#ff3a3a", dark: true},
  blue:   {bg: "#123fb5", bg2: "#2f7dff", dark: true},
  green:  {bg: "#0b6b34", bg2: "#1fb35b", dark: true},
  orange: {bg: "#e0600c", bg2: "#ff9d3c", dark: true},
  yellow: {bg: "#ffcf00", bg2: "#ffe666", dark: false},
  white:  {bg: "#f1f4f9", bg2: "#ffffff", dark: false},
};
function splitLines(s) {
  s = String(s || "");
  if (s.indexOf("／") >= 0) return s.split("／").filter(Boolean).slice(0, 2);
  if (s.length <= 7) return [s];
  let best = -1;
  for (let i = 2; i < s.length - 1; i++) if ("、，。 　？！".indexOf(s[i]) >= 0 && (best < 0 || Math.abs(i + 1 - s.length / 2) < Math.abs(best - s.length / 2))) best = i + 1;
  return best > 0 ? [s.slice(0, best).trim(), s.slice(best).trim()] : [s];
}
function drawThumb(box, t) {
  if (!box) return;
  if (t.layout) return drawLayout(box, t.layout);
  const P = PAL[t.color] || (t.focus === "face" ? PAL.navy : PAL.yellow);
  const id = box.id, face = t.focus === "face", type = t.type || "D";
  const tx = t.texts || {}, main = splitLines(tx.main), sub = String(tx.sub || "").replace(/／/g, "");
  const ink = P.dark ? "#FFFFFF" : "#111111", acc = P.dark ? "#FFE14D" : "#E60012", edge = P.dark ? "#000000" : "#FFFFFF";
  const F = `font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-weight="900" stroke-linejoin="round" style="paint-order:stroke"`;
  const T = (x, y, size, fill, s, o = {}) => `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" ${o.stroke !== false ? `stroke="${o.stroke || edge}" stroke-width="${Math.round(size * (o.sw || 0.16))}"` : ""} text-anchor="${o.anchor || "middle"}" data-maxw="${o.maxw || 1160}" ${o.id ? `id="${o.id}"` : ""}>${esc(s)}</text>`;
  const person = (cx, sc) => `<g transform="translate(${cx},720) scale(${sc})"><circle cx="0" cy="-440" r="150" fill="url(#pp${id})"/>
      <path d="M-300 0 C -290 -190 -170 -300 0 -300 C 170 -300 290 -190 300 0 Z" fill="url(#pp${id})"/></g>`;
  const chip = (x, y, s) => `<g><rect x="${x}" y="${y}" width="${s.length * 30 + 44}" height="56" rx="28" fill="rgba(0,0,0,.55)"/>
      <text x="${x + 22}" y="${y + 38}" font-size="28" fill="#fff" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-weight="700">${esc(s)}</text></g>`;
  let body = "";
  const mainLines = (cx, y, size, fill, o = {}) => main.length === 1 ? T(cx, y, size, fill, main[0], o)
    : T(cx, y - size * 0.58, size, fill, main[0], o) + T(cx, y + size * 0.58, size, fill, main[1], o);
  if (face) {
    if (type === "C") {
      body += person(330, 0.78) + person(950, 0.78);
      body += `<circle cx="640" cy="430" r="86" fill="${acc}" stroke="${edge}" stroke-width="10"/>` + T(640, 466, 96, P.dark ? "#111" : "#fff", "VS", {stroke: false});
      body += T(330, 150, 104, ink, main.join(""), {maxw: 580}) + T(950, 150, 104, acc, sub || "", {maxw: 580});
    } else {
      body += person(type === "A" ? 800 : 640, 1);
      if (type === "A") {  // 吹き出しは左、人物は少し右（頭に重ねない）
        body += `<path d="M76 40 H564 a36 36 0 0 1 36 36 V244 a36 36 0 0 1 -36 36 H540 L640 360 L470 280 H76 a36 36 0 0 1 -36 -36 V76 a36 36 0 0 1 36 -36 Z" fill="#fff" stroke="#111" stroke-width="8"/>`;
        body += main.length === 1 ? T(320, 190, 96, "#111", main[0], {stroke: false, maxw: 510}) : T(320, 140, 84, "#111", main[0], {stroke: false, maxw: 510}) + T(320, 242, 84, "#111", main[1], {stroke: false, maxw: 510});
        if (sub) body += T(640, 670, 84, acc, sub, {maxw: 1100});
      } else if (type === "E") {
        body += `<rect x="0" y="548" width="1280" height="172" fill="${P.dark ? "#000" : "#111"}"/>` + T(640, 668, 110, "#fff", main.join(""), {stroke: false, maxw: 1180});
        if (sub) body += T(640, 120, 70, ink, sub, {maxw: 1100});
      } else {
        if (sub) body += T(640, 118, 76, acc, sub, {maxw: 1100});
        body += mainLines(640, main.length === 1 ? 630 : 585, 128, ink, {maxw: 1200, sw: 0.2});
        if (type === "D") body += T(1090, 330, 220, acc, "？", {}) + T(190, 360, 160, acc, "！", {});
        if (type === "B") body += `<g transform="rotate(-12 1060 220)"><rect x="930" y="160" width="260" height="120" rx="14" fill="none" stroke="#E60012" stroke-width="12"/></g>` + `<g transform="rotate(-12 1060 220)">${T(1060, 250, 76, "#E60012", "公開", {stroke: false})}</g>`;
      }
    }
    if (t.expression) body += type === "C" ? chip(530, 610, "表情：" + t.expression) : chip(type === "A" ? 1000 : 190, 150, "表情：" + t.expression);
  } else {
    if (type === "A") {
      body += `<path d="M110 70 H1170 a50 50 0 0 1 50 50 V470 a50 50 0 0 1 -50 50 H420 L300 640 L320 520 H160 a50 50 0 0 1 -50 -50 V120 a50 50 0 0 1 50 -50 Z" fill="#fff" stroke="#111" stroke-width="10"/>`;
      body += mainLines(640, 300, 150, "#111", {stroke: false, maxw: 1000});
      if (sub) body += T(900, 640, 80, P.dark ? "#fff" : "#111", sub, {maxw: 700});
    } else if (type === "B") {
      body += `<g transform="rotate(-4 640 470)"><rect x="330" y="300" width="620" height="400" rx="10" fill="#fff" stroke="#d6dbe4" stroke-width="4"/>
        ${[360, 420, 480, 540, 600].map((y, i) => `<rect x="380" y="${y}" width="${[520, 440, 500, 380, 470][i]}" height="30" fill="${i % 2 ? "#111" : "#c9ced8"}"/>`).join("")}</g>`;
      body += `<g transform="rotate(-14 1010 420)"><rect x="860" y="360" width="300" height="130" rx="16" fill="none" stroke="#E60012" stroke-width="14"/>${T(1010, 455, 88, "#E60012", "公開", {stroke: false})}</g>`;
      body += mainLines(640, 170, 128, ink, {maxw: 1180, sw: 0.2});
      if (sub) body += T(640, main.length === 1 ? 268 : 330, 64, acc, sub, {maxw: 1100});
    } else if (type === "C") {
      const right = P.dark ? (P === PAL.red ? "#123fb5" : "#E60012") : "#111111";
      body += `<rect x="640" y="0" width="640" height="720" fill="${right}"/>`;
      body += T(320, 400, 150, ink, main.join(""), {maxw: 560, sw: 0.18}) + T(960, 400, 150, P.dark ? "#FFE14D" : "#fff", sub || "", {maxw: 560, stroke: "#000", sw: 0.18});
      body += `<circle cx="640" cy="360" r="92" fill="#FFE14D" stroke="#000" stroke-width="10"/>` + T(640, 398, 100, "#E60012", "VS", {stroke: false});
    } else if (type === "D") {
      body += `<text x="1010" y="650" font-size="720" fill="${acc}" opacity=".22" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-weight="900">？</text>`;
      body += main.length === 1 ? T(70, 400, 170, ink, main[0], {anchor: "start", maxw: 1140, sw: 0.2}) : T(70, 300, 160, ink, main[0], {anchor: "start", maxw: 1140, sw: 0.2}) + T(70, 480, 160, ink, main[1], {anchor: "start", maxw: 1140, sw: 0.2});
      if (sub) body += T(70, 640, 80, acc, sub, {anchor: "start", maxw: 1000});
    } else if (type === "F") {
      body += `<rect x="40" y="40" width="1200" height="640" rx="36" fill="none" stroke="${acc}" stroke-width="12"/>`;
      body += mainLines(640, 330, 150, ink, {maxw: 1080, sw: 0.18});
      if (sub) body += T(1150, 600, 72, acc, sub, {anchor: "end", maxw: 900});
    } else {  // E 結果の告白：余白を活かして一言だけ
      body += mainLines(640, 380, 180, ink, {maxw: 1100, sw: 0.14, id: "em" + id});
      body += `<rect id="ul${id}" x="340" y="${main.length === 1 ? 440 : 540}" width="600" height="14" rx="7" fill="${acc}"/>`;
      if (sub) body += T(640, 620, 70, P.dark ? "#cbd5e1" : "#555", sub, {stroke: false, maxw: 1000});
    }
  }
  box.innerHTML = `<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
    <defs><radialGradient id="bg${id}" cx="50%" cy="42%" r="78%"><stop offset="0" stop-color="${P.bg2}"/><stop offset="1" stop-color="${P.bg}"/></radialGradient>
      <linearGradient id="pp${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.dark ? "#dfe5ef" : "#5c6475"}"/><stop offset="1" stop-color="${P.dark ? "#8f9ab0" : "#2b3140"}"/></linearGradient></defs>
    <rect width="1280" height="720" fill="url(#bg${id})"/><g ${F}>${body}</g></svg>`;
  // はみ出す文字は小さくする
  box.querySelectorAll("text[data-maxw]").forEach(el => {
    const max = +el.dataset.maxw; let fs = parseFloat(el.getAttribute("font-size"));
    while (el.getComputedTextLength() > max && fs > 36) { fs -= 4; el.setAttribute("font-size", fs); if (el.getAttribute("stroke-width")) el.setAttribute("stroke-width", Math.round(fs * 0.16)); }
  });
  const em = box.querySelector("#em" + id), ul = box.querySelector("#ul" + id);
  if (em && ul) { const w = Math.min(1100, em.getComputedTextLength()); ul.setAttribute("x", 640 - w / 2); ul.setAttribute("width", w); }
}

// ---------- 競合サムネイルの再現 ----------
// AIが参考の動画のサムネイル画像を見て書いた設計図（layout）どおりに描く。座標は画面に対する割合（0〜1）
// 人物は、AIで作った架空の人物（persons/ のPNG。背景を切り抜いたもの）から選ぶ
const PERSON_BASE = "persons/", SCENE_BASE = "scenes/";
const SCENE_IDS = ["living", "house", "office", "construction", "classroom", "clinic", "shop", "desk"];
const PERSON_IDS = ["m40_suit_surprise", "m40_suit_serious", "m40_suit_troubled", "f30_office_surprise", "f30_office_serious", "f30_office_troubled",
  "m50_work_surprise", "m50_work_serious", "m30_casual_surprise", "m30_casual_troubled", "f40_uniform_serious", "f40_suit_surprise"];
function drawLayout(box, L) {
  const id = box.id, W = 1280, H = 720, SVGNS = "http://www.w3.org/2000/svg";
  const num = (v, lo, hi, d) => { v = Number(v); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
  const col = (c, d) => /^#[0-9a-fA-F]{6}$/.test(c || "") ? c : d;
  const bg = L.bg || {}, c1 = col(bg.c1, "#111111"), c2 = col(bg.c2, c1);
  const ol = L.outline === "" ? "" : col(L.outline, "#FFFFFF");  // 人物のフチ（空ならフチなし）
  let defs = ol ? `<filter id="ol${id}" x="-15%" y="-15%" width="130%" height="130%"><feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/>
    <feFlood flood-color="${ol}"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>` : "";
  let back = "", front = "", people = "", texts = "", frame = "", frameT = 0;
  // 背景：写真（架空の場面）・単色・グラデーション・塗り分け
  if (bg.kind === "photo" && SCENE_IDS.indexOf(bg.scene) >= 0) {
    back += `<rect width="${W}" height="${H}" fill="${c1}"/><image href="${SCENE_BASE}${bg.scene}.jpg" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice"/>`;
    const dim = num(bg.dim, 0, 0.7, 0);
    if (dim) back += `<rect width="${W}" height="${H}" fill="#000000" opacity="${dim}"/>`;
  } else if (bg.kind === "gradient") {
    const d = bg.dir === "v" ? 'x2="0" y2="1"' : bg.dir === "d" ? 'x2="1" y2="1"' : 'x2="1" y2="0"';
    defs += `<linearGradient id="bg${id}" x1="0" y1="0" ${d}><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
    back += `<rect width="${W}" height="${H}" fill="url(#bg${id})"/>`;
  } else {
    back += `<rect width="${W}" height="${H}" fill="${c1}"/>`;
    if (bg.kind === "split") {
      const at = num(bg.at, 0.1, 0.9, 0.5);
      back += bg.dir === "v" ? `<rect y="${H * at}" width="${W}" height="${H * (1 - at)}" fill="${c2}"/>`
        : bg.dir === "d" ? `<polygon points="${W * at + 90},0 ${W},0 ${W},${H} ${W * at - 90},${H}" fill="${c2}"/>`
        : `<rect x="${W * at}" width="${W * (1 - at)}" height="${H}" fill="${c2}"/>`;
    }
  }
  // 飾り：帯・箱・丸・矢印・吹き出し・線・画面のフチの枠（layer が front なら人物の上に描く。枠はいちばん上）
  (L.shapes || []).slice(0, 8).forEach(s => {
    const x = num(s.x, -0.2, 1.2, 0) * W, y = num(s.y, -0.2, 1.2, 0) * H, w = num(s.w, 0, 1.4, 0.2) * W, h = num(s.h, 0, 1.4, 0.1) * H;
    const fill = col(s.fill, "none"), stroke = col(s.stroke, "none"), sw = stroke === "none" ? 0 : 12, rot = num(s.rot, -45, 45, 0);
    const tr = rot ? ` transform="rotate(${rot} ${x + w / 2} ${y + h / 2})"` : "";
    let el;
    if (s.kind === "circle") el = `<ellipse cx="${x + w / 2}" cy="${y + h / 2}" rx="${w / 2}" ry="${h / 2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${tr}/>`;
    else if (s.kind === "arrow") {
      const x2 = num(s.x2, -0.2, 1.2, (x + w) / W) * W, y2 = num(s.y2, -0.2, 1.2, (y + h) / H) * H, len = Math.max(60, Math.hypot(x2 - x, y2 - y));
      const deg = Math.atan2(y2 - y, x2 - x) * 180 / Math.PI, hl = Math.min(110, len * 0.45);
      el = `<polygon points="0,-20 ${len - hl},-20 ${len - hl},-52 ${len},0 ${len - hl},52 ${len - hl},20 0,20" fill="${fill === "none" ? "#E60012" : fill}" stroke="${stroke}" stroke-width="${sw ? 8 : 0}" transform="translate(${x},${y}) rotate(${deg})"/>`;
    } else if (s.kind === "bubble") {
      const tx = s.tail === "right" ? x + w * 0.78 : s.tail === "left" ? x + w * 0.22 : x + w * 0.5;
      el = `<g${tr}><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w, h) * 0.22}" fill="${fill === "none" ? "#FFFFFF" : fill}" stroke="${stroke}" stroke-width="${sw}"/>
        <polygon points="${tx - 34},${y + h - 2} ${tx + 34},${y + h - 2} ${tx + (s.tail === "left" ? -60 : s.tail === "right" ? 60 : 0)},${y + h + 70}" fill="${fill === "none" ? "#FFFFFF" : fill}" stroke="${stroke}" stroke-width="${sw}"/></g>`;
    } else if (s.kind === "frame") {
      const hv = num(s.h, 0, 1.4, 0.025), t = (hv > 0.1 ? 0.025 : Math.max(0.006, Math.min(0.04, hv))) * H;
      const c = fill !== "none" ? fill : stroke !== "none" ? stroke : "#FFE600";
      frameT = Math.max(frameT, t);
      frame += `<rect x="${t / 2}" y="${t / 2}" width="${W - t}" height="${H - t}" fill="none" stroke="${c}" stroke-width="${t}"/>`;
      return;
    } else if (s.kind === "line") { const lh = Math.min(Math.max(8, h), H * 0.03); el = `<rect x="${x}" y="${y}" width="${w}" height="${lh}" rx="${lh / 2}" fill="${fill === "none" ? stroke : fill}"${tr}/>`; }
    else el = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${s.kind === "rect" ? 16 : 0}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${tr}/>`;
    if (s.layer === "front") front += el; else back += el;
    // 飾りの中の文字（「VS」「公開」など）
    if (s.t && s.kind !== "arrow" && s.kind !== "line") {
      const fs = Math.min(h * 0.58, H * 0.2), cy = s.kind === "bubble" ? y + h / 2 : y + h / 2;
      texts += `<g class="tx" data-box="" data-in="1"${tr}><text x="${x + w / 2}" y="${cy + fs * 0.36}" font-size="${fs}" fill="${col(s.tc, "#FFFFFF")}" text-anchor="middle" data-maxw="${w * 0.86}" data-swr="0">${esc(String(s.t).slice(0, 8))}</text></g>`;
    }
  });
  // 人物：下端を画面の下にそろえ、中心の横位置（cx）と高さ（h）で置く。白フチつき
  (L.people || []).slice(0, 2).forEach(p => {
    if (PERSON_IDS.indexOf(p.id) < 0) return;
    const h = num(p.h, 0.3, 1.25, 0.9) * H, cx = num(p.cx, 0, 1, 0.5) * W;
    const img = `<image href="${PERSON_BASE}${p.id}.png" x="${cx - W / 2}" y="${H - h}" width="${W}" height="${h}" preserveAspectRatio="xMidYMax meet" ${ol ? ` filter="url(#ol${id})"` : ""}/>`;
    people += p.flip ? `<g transform="translate(${2 * cx},0) scale(-1,1)">${img}</g>` : img;
  });
  // 文字の下地の色（帯・箱・吹き出し・丸・背景）。写真の上なら空
  function luminance(h) { const v = [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255).map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; }
  function contrast(a, b) { const x = luminance(a), y = luminance(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  let underBox = null;  // 下地になった帯・箱の範囲（文字がはみ出したら縁取りを足すため）
  function underColor(px, py) {
    let u = "";
    underBox = null;
    (L.shapes || []).slice(0, 8).forEach(c => {
      const f = col(c.fill, ""), sx = num(c.x, -0.2, 1.2, 0), sy = num(c.y, -0.2, 1.2, 0), sw2 = num(c.w, 0, 1.4, 0.2), sh = num(c.h, 0, 1.4, 0.1);
      if (f && ["band", "rect", "bubble", "circle"].indexOf(c.kind) >= 0 && !num(c.rot, -45, 45, 0) && px >= sx && px <= sx + sw2 && py >= sy && py <= sy + sh) {
        u = f; underBox = [sx * W, sy * H, (sx + sw2) * W, (sy + sh) * H];
      }
    });
    if (u) return u;
    if (bg.kind === "photo" && SCENE_IDS.indexOf(bg.scene) >= 0) return "";
    if (bg.kind === "split") { const at = num(bg.at, 0.1, 0.9, 0.5); return (bg.dir === "v" ? py : px) < at ? c1 : c2; }
    if (bg.kind === "gradient") return "#" + [1, 3, 5].map(i => Math.round((parseInt(c1.substr(i, 2), 16) + parseInt(c2.substr(i, 2), 16)) / 2).toString(16).padStart(2, "0")).join("");  // 中間の色で見る
    return c1;
  }
  // 文字：位置・大きさ・色・縁取り・箱。「／」で改行
  (L.texts || []).slice(0, 5).forEach(t => {
    const lines = String(t.t || "").split("／").map(x => x.trim()).filter(Boolean).slice(0, 3);
    if (!lines.length) return;
    const size = num(t.size, 0.05, 0.3, 0.14) * H, y = num(t.y, 0.05, 1, 0.3) * H;
    let x = num(t.x, 0, 1, 0.05) * W, anchor = ["start", "middle", "end"].indexOf(t.align) >= 0 ? t.align : "start";
    let fill = col(t.color, "#FFFFFF"), stroke = col(t.stroke, ""), swr = stroke ? num(t.sw, 0, 0.3, 0.14) : 0;
    const under = col(t.box, "") || underColor(x / W, (y - size * 0.4) / H);
    if (under) {
      if (contrast(fill, under) < 3 && !(stroke && swr >= 0.08 && contrast(stroke, under) >= 3))
        fill = contrast("#111111", under) >= contrast("#FFFFFF", under) ? "#111111" : "#FFFFFF";
    } else if (!stroke) { stroke = luminance(fill) > 0.4 ? "#000000" : "#FFFFFF"; swr = 0.1; }
    let maxw = num(t.maxw, 0.1, 1, 0.9) * W;
    const rot = num(t.rot, -30, 30, 0);
    // 吹き出し・箱の中に置いた文字は、その中央に収める。帯の中の文字は、帯からはみ出さない幅にする
    const inside = (L.shapes || []).slice(0, 8).find(c => ["bubble", "rect", "band"].indexOf(c.kind) >= 0 && !num(c.rot, -45, 45, 0) &&
      x >= num(c.x, -0.2, 1.2, 0) * W && x <= (num(c.x, -0.2, 1.2, 0) + num(c.w, 0, 1.4, 0.2)) * W &&
      y - size * 0.4 >= num(c.y, -0.2, 1.2, 0) * H && y - size * 0.4 <= (num(c.y, -0.2, 1.2, 0) + num(c.h, 0, 1.4, 0.1)) * H);
    if (inside) {
      const cx0 = num(inside.x, -0.2, 1.2, 0) * W, cw = num(inside.w, 0, 1.4, 0.2) * W, pd = Math.min(cw * 0.07, 36);
      if (inside.kind === "band") {
        const room = anchor === "start" ? cx0 + cw - pd - x : anchor === "end" ? x - cx0 - pd : 2 * Math.min(x - cx0, cx0 + cw - x) - 2 * pd;
        maxw = Math.max(W * 0.08, Math.min(maxw, room));
      } else { x = cx0 + cw / 2; anchor = "middle"; maxw = Math.max(W * 0.08, cw - 2 * pd); }
    }
    const ts = lines.map((s, k) => `<text x="${x}" y="${y + k * size * 1.12}" font-size="${size}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${swr * size}"` : ""} text-anchor="${anchor}" data-maxw="${maxw}" data-swr="${swr}">${esc(s)}</text>`).join("");
    const ub = !col(t.box, "") && underBox && !stroke ? ` data-ub="${underBox.join(",")}"` : "";
    texts += `<g class="tx" data-box="${col(t.box, "")}"${ub}${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ""}>${ts}</g>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="${SVGNS}"><defs>${defs}</defs>${back}${people}${front}
    <g font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-weight="900" stroke-linejoin="round" style="paint-order:stroke">${texts}</g>${frame}</svg>`;
  // はみ出す行があれば、そのかたまり全体を同じ割合で小さくする。人物の顔にかかる文字は顔の横の広い側へ寄せ、
  // 画面の内側に収めてから、箱を後から敷く
  const shrink = (ts, k) => {
    if (!(k < 1)) return;
    const y0 = +ts[0].getAttribute("y"), fs = parseFloat(ts[0].getAttribute("font-size")) * k;
    ts.forEach((el, i) => { el.setAttribute("font-size", fs); el.setAttribute("y", y0 + i * fs * 1.12); if (+el.dataset.swr) el.setAttribute("stroke-width", fs * el.dataset.swr); });
  };
  const faces = (L.people || []).slice(0, 2).filter(p => PERSON_IDS.indexOf(p.id) >= 0).map(p => {
    const h = num(p.h, 0.3, 1.25, 0.9) * H, cx = num(p.cx, 0, 1, 0.5) * W;
    return {x1: cx - 0.19 * h, x2: cx + 0.19 * h, y1: H - h, y2: H - h * 0.5};
  });
  // 1) はみ出しを縮める 2) 顔にかかるものは、横へずらす量を決める（同じ列の文字は同じだけずらして、そろいを崩さない）
  const items = [...box.querySelectorAll("g.tx")].map(g => {
    const ts = [...g.querySelectorAll("text")];
    let k = 1;
    ts.forEach(el => { const w = el.getComputedTextLength(), m = +el.dataset.maxw; if (w > m) k = Math.min(k, m / w); });
    // 小さくしすぎない（画面の高さの6.5%まで。飾りの中の文字は除く）
    const fs0 = parseFloat(ts[0].getAttribute("font-size")), floor = Math.min(fs0, H * 0.065);
    if (!g.dataset.in && fs0 * k < floor) k = floor / fs0;
    shrink(ts, k);
    const it = {g: g, ts: ts, dx: 0, key: ts[0].getAttribute("text-anchor") + Math.round(+ts[0].getAttribute("x") / 25)};
    it.bp = () => g.dataset.box ? parseFloat(ts[0].getAttribute("font-size")) * 0.16 : 0;
    if (g.dataset.in || /rotate/.test(g.getAttribute("transform") || "")) return it;
    const m = H * 0.03, pad = W * 0.015;
    faces.forEach(f => {
      let b = g.getBBox();
      const x1 = b.x + it.dx - it.bp(), x2 = b.x + it.dx + b.width + it.bp(), y1 = b.y - it.bp(), y2 = b.y + b.height + it.bp();
      if (x2 <= f.x1 || x1 >= f.x2 || y2 <= f.y1 || y1 >= f.y2) return;
      const left = (x1 + x2) / 2 < (f.x1 + f.x2) / 2, room = left ? f.x1 - pad - m : W - m - pad - f.x2;
      if (room < W * 0.22) return;  // 顔の横に余地がなければ、そのまま
      if (x2 - x1 > room) { shrink(ts, room / (x2 - x1)); b = g.getBBox(); }
      const l0 = b.x - it.bp(), w = b.width + 2 * it.bp();
      it.dx = left ? Math.max(m - l0, Math.min(it.dx, f.x1 - pad - (l0 + w))) : Math.min(W - m - w - l0, Math.max(it.dx, f.x2 + pad - l0));
    });
    return it;
  });
  const cols = {};
  items.forEach(it => { if (!it.g.dataset.in) (cols[it.key] = cols[it.key] || []).push(it); });
  Object.keys(cols).forEach(key => {
    const ds = cols[key].map(it => it.dx), hi = Math.max(0, ...ds), lo = Math.min(0, ...ds), d = -lo > hi ? lo : hi;
    cols[key].forEach(it => { it.dx = d; });
  });
  // 3) 画面の内側に収める 4) 箱を後から敷く
  items.forEach(({g, ts, dx, bp}) => {
    if (!g.dataset.in) {
      const m = Math.max(H * 0.03, frameT + H * 0.012), b = g.getBBox();
      let dy = 0;
      const l0 = b.x + dx - bp(), r0 = b.x + dx + b.width + bp();
      if (b.y - bp() < m) dy = m - (b.y - bp()); else if (b.y + b.height + bp() > H - m) dy = H - m - (b.y + b.height + bp());
      if (l0 < m) dx += m - l0; else if (r0 > W - m) dx += W - m - r0;
      if (dx || dy) g.setAttribute("transform", `translate(${dx},${dy}) ` + (g.getAttribute("transform") || ""));
      // 下地の帯・箱からはみ出した文字（写真や別の色にかかる）には、縁取りを足して読めるようにする
      if (g.dataset.ub) {
        const u = g.dataset.ub.split(",").map(Number), tol = H * 0.02;
        if (b.x + dx < u[0] - tol || b.x + dx + b.width > u[2] + tol || b.y + dy < u[1] - tol || b.y + dy + b.height > u[3] + tol)
          ts.forEach(el => { const fs = parseFloat(el.getAttribute("font-size")); el.setAttribute("stroke", luminance(el.getAttribute("fill")) > 0.4 ? "#000000" : "#FFFFFF"); el.setAttribute("stroke-width", fs * 0.1); });
      }
    }
    if (g.dataset.box) {
      const b = g.getBBox(), pad = parseFloat(ts[0].getAttribute("font-size")) * 0.16;
      const r = document.createElementNS(SVGNS, "rect");
      r.setAttribute("x", b.x - pad); r.setAttribute("y", b.y - pad * 0.5); r.setAttribute("width", b.width + pad * 2); r.setAttribute("height", b.height + pad);
      r.setAttribute("fill", g.dataset.box); g.insertBefore(r, g.firstChild);
    }
  });
}
</script>
</body>
</html>
